name: NFL Big Data Bowl 2027 Proof Gate

on:
  pull_request:
    paths:
      - "projects/nfl-big-data-bowl-2027/**"
      - ".github/workflows/nfl-big-data-bowl-2027.yml"
  push:
    branches: ["main"]
    paths:
      - "projects/nfl-big-data-bowl-2027/**"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/nfl-big-data-bowl-2027
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/nfl-big-data-bowl-2027/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
